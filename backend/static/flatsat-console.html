<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title data-i18n="title_console">PwnSat Console FlatSat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>PWN<span>SAT</span> // <span data-i18n="header_console">CONSOLE FLATSAT</span></h1>
    </div>
    <div class="header-right">
      <a href="index.html" class="nav-link" data-i18n="nav_to_groundstation">&larr; Ground Station (radio)</a>
      <span id="clock"></span>
    </div>
  </header>

  <main class="usb-main">
    <section class="panel" id="panel-usb-full">
      <h2>
        <span><span data-i18n="header_console">Console FlatSat</span> <span class="badge badge-usb" data-i18n="badge_usb">usb direct</span></span>
        <span id="usb-status" data-i18n="status_disconnected">DECONNECTE</span>
      </h2>
      <p class="hint" data-i18n="console_hint">
        Lien de debug direct Mac&harr;FlatSat (port <code>fsat1</code>), totalement separe
        du Ground Station radio. Toute ligne tapee ici part telle quelle sur la console du
        FlatSat -- menu texte, <code>SC STATUS</code>, <code>SC INJECT ...</code>, etc.
      </p>
      <div id="usb-terminal"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="i18n.js?v=1"></script>
  <script src="flatsat-console.js?v=2"></script>
</body>
</html>
